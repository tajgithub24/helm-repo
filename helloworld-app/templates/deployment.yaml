apiVersion: apps/v1
kind: Deployment
metadata:
  name: helloworld-app
  namespace: devops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: helloworld-app
  template:
    metadata:
      labels:
        app: helloworld-app
    spec:
      containers:
        - name: helloworld-container
          image: taj070796/helloworld:latest
          ports:
            - containerPort: 8080
      nodeSelector:
        agentpool: nodepool2
      imagePullSecrets:
        - name: dockerhub-secret

